# Локальная инфраструктура для dev.
#
# - postgres / redis — общие для всех сред.
# - api — backend в контейнере (Phase 3.C: WeasyPrint требует Pango/HarfBuzz,
#   на Windows нативный uvicorn не запустит PDF-рендер — см. ADR 0008).
#
# Подъём:
#   docker compose up -d postgres redis  # только инфра, бэкенд локально
#   docker compose up -d                 # с api в контейнере (для PDF и интеграции)

services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit_assistant
    ports:
      # Host 5433 → container 5432: на dev-машинах часто стоит локальный Postgres на 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: credit-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Внутри compose-сети postgres/redis резолвятся по имени сервиса.
      DATABASE_URL: postgresql+asyncpg://credit:credit@postgres:5432/credit_assistant
      # T1.2 (CA-019): refresh-token denylist. Override на пустую строку → NullDenylist
      # (stateless 7-day fallback).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: dev
      LOG_LEVEL: INFO
      # Phase 4: режим инсталляции (bank | accountant). Один режим на инсталляцию.
      # Override через `.env` для compose: `APP_MODE=bank docker compose up -d --build api`.
      APP_MODE: ${APP_MODE:-accountant}
      # Phase 10 brand-tenant (ADR-0011 / CA-066): для PDF-рендера. По умолчанию
      # `default` brand из `config/brands/default.json`. Override через env:
      # `BRAND_ID=uzbekbank docker compose up -d --build api`.
      BRAND_ID: ${BRAND_ID:-default}
      # Phase 4: JWT для bank-auth. ДЛЯ DEV ТОЛЬКО — в проде передавать через
      # секреты банка (Vault/SOPS). Pydantic Settings читает JWT_SECRET case-insensitively.
      JWT_SECRET: ${JWT_SECRET:-dev-compose-insecure-change-me-32bytes-minimum}
      # CORS — для frontend на host:3000. Pydantic Settings парсит list-поля как
      # JSON, поэтому передаём массивом, а не comma-separated.
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      # CA-DS9: фоновый сбор uptime раз в минуту → честная статистика дней
      # без сбоев в UI /settings → О системе, независимо от user-traffic.
      UPTIME_COLLECTOR_ENABLED: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
