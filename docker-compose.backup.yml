# T3.4 — Backup sidecar override.
#
# Подъём:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
#
# Сервис db-backup поднимается отдельным контейнером постгрес-альпайн (тот же
# image что и postgres → одинаковый pg_dump major-version), ставит dcron и age
# при первом старте, прописывает crontab "0 2 * * *" → запускает
# /scripts/backup_postgres.sh каждые сутки в 02:00 UTC.
#
# Host bind ./backups → /var/backups/credit-assistant в контейнере. Host видит
# свежие dumps в .gitignored директории.
#
# Production: системный systemd-timer вместо sidecar (см. db-backup.md
# Section 5). Tarball deploy (T3.6) включит обе опции.

services:
  db-backup:
    image: postgres:16-alpine
    container_name: credit-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: credit
      PGPASSWORD: credit
      PGDATABASE: credit_assistant
      BACKUP_DIR: /var/backups/credit-assistant
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # Опционально: путь к age public key. Если задан — backup шифруется.
      # Default не задан → plain *.dump (dev mode).
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/var/backups/credit-assistant
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache bash age coreutils >/dev/null
        # Скрипты примонтированы read-only (executable bit взведён в git
        # через update-index --chmod=+x — host-bind сохраняет mode).
        echo "credit-db-backup ready: hourly check, daily pg_dump → $$BACKUP_DIR"
        # Простой sleep-loop вместо dcron: на Windows Docker Desktop /
        # WSL2 crond падает на setpgid. Для prod использовать systemd-timer
        # (см. deploy/systemd/credit-restore-drill.timer как образец).
        # Запускаем backup один раз в сутки в 02:00 UTC.
        last_run=""
        while true; do
          now="$$(date -u +%Y-%m-%d)"
          hour="$$(date -u +%H)"
          if [ "$$hour" = "02" ] && [ "$$now" != "$$last_run" ]; then
            /scripts/backup_postgres.sh && last_run="$$now"
          fi
          sleep 600
        done
