version: v1

# 24 red-flag правил для МСБ-заёмщиков Узбекистана.
# Severity weights калибруем после Phase 2 на реальных кейсах.
# Источники: ЦБ РУз №2696 (lex.uz/ru/docs/2703056), НК РУз (lex.uz/ru/docs/4674893),
#   Базель III (BCBS d424 — bis.org/bcbs/publ/d424.pdf), FATF Recommendations,
#   EAG (Eurasian Group), Закон РУз ЗРУ-660 «О ПОД/ФТ».
# ADR-0024 (2026-05-19): foundational sources verified через 3-way research
#   reconcile (Claude/ChatGPT/Qwen). Прежние ссылки на «ЦБ РУз №27-п»,
#   «НК РУз ст.256» и «Group-IB UZ fraud report» заменены на актуальные.
# T0.4 / ADR-0015: name_uz — финальные UZ-переводы (commit 3). Терминология:
# Soliq xltx стандарт (QQS, EHF), gov.uz словарь. ОКВЭД / INN — кириллица /
# латиница сохранены как общеупотребимые сокращения.

rules:
  # --- Структурные ---
  - id: DIRECTOR_CHANGED_6M
    name: "Смена директора за последние 6 месяцев + материальная заявка"
    name_uz: "Soʻnggi 6 oyda direktor almashishi + jiddiy soʻrov"
    category: structural
    severity: medium
    source: "FATF Recommendation 24 (Beneficial Ownership) — fatf-gafi.org; Закон РУз ЗРУ-660 «О противодействии легализации доходов»; внутренние методики UZ-банков"
    source_uz: "FATF tavsiya 24 (Beneficial Ownership); ЎзР ЗРУ-660 sonli qonun; UZ-banklarning ichki uslublari"
    formula: "(as_of - director_appointed_at).days <= 180 AND loan_request.amount > 500_000_000 UZS"
    rationale: "Свежий директор + материальная заявка (≥500 млн сум) — паттерн фронт-фигуры (AML/CDD). Без материальной заявки чаще operational change, чем AML — ADR-0024 audit"

  - id: OKVED_CHANGED_12M
    name: "Изменение основного ОКЭД собственником за последние 12 месяцев"
    name_uz: "Soʻnggi 12 oyda egasi tomonidan asosiy ОКЭД oʻzgarishi"
    category: structural
    severity: medium
    source: "Постановление КМ РУз №275 от 24.08.2016 (UZ-ОКЭД ред.2); FATF Recommendation 10 (CDD); внутренние методики UZ-банков"
    source_uz: "ЎзР Вазирлар Маҳкамасининг 24.08.2016 №275-сонли қарори (UZ-ОКЭД); FATF tavsiya 10 (CDD)"
    formula: "borrower.oked_changed_by_owner AND (as_of - okved_main_changed_at).days <= 365"
    rationale: "Смена деятельности собственником перед кредитом — AML/CDD сигнал (может скрывать фрод-схему). ADR-0024 Session 3: добавлен gate `oked_changed_by_owner=True` — Госкомстат auto-overwrite (массовая перекатегоризация без заёмщика) больше не триггерит правило"

  - id: LOAN_TO_REVENUE_RATIO
    name: "Запрашиваемая сумма vs годовая выручка (secured-variant)"
    name_uz: "Soʻralayotgan summa yillik tushum bilan (taʼminot variantini hisobga olgan)"
    category: structural
    severity: high
    source: "IFC SME Banking Knowledge Guide (unsecured МСБ-baseline 0.30-0.40, secured 0.60-0.70); внутренние методики UZ-банков"
    source_uz: "IFC SME Banking Knowledge Guide (taʼminlanmagan KOʻB baseline 0.30-0.40, taʼminlangan 0.60-0.70); UZ-banklarning ichki uslublari"
    formula: "ratio > 0.40 (unsecured / collateral=none|null) OR ratio > 0.70 (secured)"
    rationale: "Перекредитованность — ведущий предиктор дефолта. ADR-0024 Session 3: добавлен secured-variant — `collateral_type` ∈ {real_estate, movable, guarantee, other} поднимает порог до 0.70 (банк имеет страховочную базу). None / 'none' (legacy + unsecured) → строгий порог 0.40 (IFC SME baseline)"

  # --- Финансовые ---
  - id: REVENUE_DROP_MOM_30
    name: "Падение выручки >30% МоМ два месяца подряд (вне декабря–февраля)"
    name_uz: "Tushumning oydan oyga 30% dan ortiq pasayishi ketma-ket 2 oy (12–2 oydan tashqari)"
    category: financial
    severity: high
    source: "Basel III SREP; FRB SR 11-7 / SR 26-02; внутренняя методология. ADR-0024 audit: убрана подложная атрибуция «ЦБ РУз №27-п»"
    source_uz: "Basel III SREP; FRB SR 11-7 / SR 26-02; ichki uslubiyat"
    formula: "mom_pct < -0.30 for 2 consecutive months AND month NOT IN (12, 1, 2)"
    rationale: "Резкое падение выручки — сильный предиктор дефолта на 6 мес. ADR-0024: добавлен сезонный фильтр (декабрь–февраль) — натуральный спад из-за закрытия года/праздников / низкого инвентаря даёт ложноположительные"

  - id: REVENUE_DROP_YOY_50
    name: "Падение годовой выручки >50% YoY"
    name_uz: "Yillik tushumning yildan yilga 50% dan ortiq pasayishi"
    category: financial
    severity: high
    source: "Altman Z-score методология; Iwanicz-Drozdowska et al. (JIFM 2017); Basel III IRB. ADR-0024 audit: убрана подложная атрибуция «ЦБ РУз №27-п»"
    source_uz: "Altman Z-score метoдологияси; Iwanicz-Drozdowska et al. (JIFM 2017); Basel III IRB"
    formula: "(curr_revenue - prev_revenue) / prev_revenue < -0.50 AND prev_revenue > 200_000_000 UZS"
    rationale: "Стратегическое сжатие бизнеса. ADR-0024: добавлен материальный порог prev_revenue >200 млн сум — ниже малое предприятие, YoY-падение технически высокое из-за shumovoy baseline"

  - id: NEGATIVE_PROFIT_3Q
    name: "Чистая прибыль ≤0 три квартала подряд"
    name_uz: "Sof foyda ketma-ket 3 chorakda ≤0"
    category: financial
    severity: high
    source: "ЦБ РУз Положение №2696 (lex.uz/ru/docs/2703056); Altman & Iwanicz-Drozdowska et al. (JIFM 2017); BCBS d424 §50"
    source_uz: "ЎзР МБ №2696-сонли қарори; Altman модели; BCBS d424 §50"
    formula: "all(net_profit <= 0 for last 3 quarters)"
    rationale: "Системная убыточность — высокий риск default"

  - id: NEGATIVE_EQUITY
    name: "Отрицательный или нулевой собственный капитал"
    name_uz: "Manfiy yoki nol oʻz kapitali"
    category: financial
    severity: critical
    source: "Базель III IRB (capital adequacy); внутренние методики банков-партнёров"
    source_uz: "Базель III IRB (capital adequacy); hamkor banklarning ichki uslublari"
    formula: "latest_annual.equity <= 0"
    rationale: "Negative equity / technical insolvency — один из сильнейших предикторов default'а: обязательства превышают активы"

  - id: VAT_GROWTH_NO_REVENUE
    name: "Рост НДС-обязательств без существенного роста выручки"
    name_uz: "QQS majburiyatlari oʻsishi tushum sezilarli oʻsmasdan"
    category: financial
    severity: medium
    source: "НК РУз гл. 34-35 (НДС-обязательства); my.soliq.uz внутренние методики; банковская практика"
    source_uz: "НК РУз 34-35-боблари; my.soliq.uz ichki uslublari; bank amaliyoti"
    formula: "vat_growth > 0.20 AND revenue_growth < 0.05"
    rationale: "Может означать фиктивный документооборот / накачивание оборота. ADR-0024 audit: revenue_growth ceiling 0% → 5% — порог 0% пропускал «выручка едва-едва не падает»"

  - id: VAT_ESF_MISMATCH
    name: "Разрыв декларация НДС vs ЭСФ >15% при материальной декларации"
    name_uz: "QQS deklaratsiyasi va EHF farqi 15% dan ortiq (jiddiy deklaratsiyada)"
    category: financial
    severity: critical
    source: "НК РУз ст. 47 (счёт-фактура) + ст. 257 (корректировка налоговой базы) + ст. 223 (сокрытие, штраф 20%) (lex.uz/ru/docs/4674893); ПКМ РУз №489 (порядок выставления ЭСФ); ст. 175-1 КоАО РУз (адм. штрафы 5-20 БРВ)"
    source_uz: "ЎзР СК 47-моддаси (ҳисобварақ-фактура) + 257 + 223 (lex.uz/ru/docs/4674893); ВМ №489-сонли қарори; МЖтК 175-1-моддаси"
    formula: "abs(vat_declared - sum_seller_esf_vat) / vat_declared > 0.15 AND vat_declared > 10_000_000 UZS"
    rationale: "Прямое расхождение — признак фиктивной отчётности. ADR-0024: добавлен материальный порог декларации >10 млн сум — ниже технические микро-периоды (закрытие квартала, единичные ввозы)"

  - id: LOW_MARGIN_HIGH_TURNOVER
    name: "Маржа <5% при годовой выручке >5 млрд сум"
    name_uz: "Marja 5% dan kam, yillik tushum 5 mlrd soʻm dan ortiq"
    category: financial
    severity: medium
    source: "Внутренние методики UZ-банков; стандартная МСБ-практика"
    source_uz: "Oʻzbekiston banklarining ichki uslublari; KOʻB standart amaliyoti"
    formula: "annual_revenue > 5_000_000_000 and margin < 0.05"
    rationale: "Большой оборот без прибыли — подозрительная схема"

  - id: FX_MISMATCH_HIGH
    name: "Валютный заём против выручки в UZS"
    name_uz: "UZS dagi tushumga qarshi valyutadagi kredit"
    category: financial
    severity: high
    source: "World Bank Financial Sector Assessment Program — Uzbekistan 2025 (FSAP UZ 2025): 44% МСБ-портфеля в иностранной валюте при доминировании UZS-выручки → open FX exposure"
    source_uz: "Jahon banki Moliyaviy sektor baholash dasturi — Oʻzbekiston 2025 (FSAP UZ 2025): KOʻB-portfelining 44% chet el valyutasida, daromad esa asosan UZS da → ochiq FX tavakkalligi"
    formula: "loan_request.amount.currency != latest_annual.revenue.currency"
    rationale: "Девальвация UZS делает обслуживание валютного долга дороже на ту же долю, при этом UZS-выручка не пересчитывается; FSAP UZ 2025 — доминирующий драйвер дефолтов МСБ"

  - id: DSCR_LOW
    name: "DSCR ниже 1,3 — обслуживание долга не покрыто"
    name_uz: "DSCR 1,3 dan past — qarz xizmati taʼminlanmagan"
    category: financial
    severity: high
    source: "Murodov O.J. (2025), Tashkent State University of Economics — DSCR≥1.3 minimum для УзР МСБ (cotton ginning); IFC SME Knowledge Guide ch.4 (DSCR≥1.25 minimum, ≥1.5 comfort)"
    source_uz: "Murodov O.J. (2025), Toshkent davlat iqtisodiyot universiteti — UZ KOʻB uchun DSCR≥1.3 minimum; IFC SME Knowledge Guide 4-bob (DSCR≥1.25 minimum)"
    formula: "DSCR = operating_cash_flow / (interest_expense + loan_amount * 12 / term_months) < 1.3"
    rationale: "Если денежного потока недостаточно для покрытия процентов + основного долга — дефолт горизонта 12 мес. Murodov 2025: эмпирический минимум 1,3 для UZ-cotton, IFC: 1,25 generic SME"

  - id: WC_INSUFFICIENT
    name: "Current Ratio <1,0 — дефицит оборотного капитала"
    name_uz: "Current Ratio 1,0 dan past — aylanma kapital yetishmasligi"
    category: financial
    severity: medium
    source: "IFC SME Knowledge Guide ch.4 «Liquidity & Working Capital» — Current Ratio < 1.0 = краткосрочные обязательства превышают оборотные активы; Murodov O.J. 2025 — leading default indicator для UZ-cotton"
    source_uz: "IFC SME Knowledge Guide 4-bob «Likvidlik va aylanma kapital» — Current Ratio < 1.0 = qisqa muddatli majburiyatlar joriy aktivlardan ortiq; Murodov O.J. 2025 — UZ-cotton uchun yetakchi default indikator"
    formula: "current_ratio = current_assets / current_liabilities < 1.0"
    rationale: "Дефицит ликвидности на горизонте 12 мес — заёмщик не способен платить по краткосрочным обязательствам без рефинансирования"

  - id: OFF_BALANCE_COMMITMENTS
    name: "Off-balance обязательства >50% активов"
    name_uz: "Balansdan tashqari majburiyatlar aktivlarning 50% dan ortiq"
    category: financial
    severity: high
    source: "BCBS d424 «Basel III: Finalising post-crisis reforms» §50 «Off-balance sheet items» (bis.org/bcbs/publ/d424.pdf); внутренние методики UZ-банков по портфельному risk weighting гарантий, лизинговых обязательств и аккредитивов"
    source_uz: "BCBS d424 «Basel III: post-crisis reforms» §50 «Balansdan tashqari moddalar»; UZ-banklarning kafolat, lizing va akkreditivlar boʻyicha portfel risk weighting uslublari"
    formula: "(guarantees_outstanding + leases_outstanding + letters_of_credit_outstanding) / total_assets > 0.50"
    rationale: "Off-balance commitments выходящие за 50% балансовых активов — leveraged exposure, невидимый в традиционных Debt/Assets и Current Ratio. ADR-0024 Session 2: при выплате по гарантии / экспирации аккредитива / лизинговом платеже создают cash-outflow без отражения в балансе"

  - id: CASH_FLOW_QUALITY
    name: "OCF <50% чистой прибыли — низкое качество прибыли"
    name_uz: "OCF sof foydaning 50% dan past — foyda sifati past"
    category: financial
    severity: medium
    source: "IFC SME Banking Knowledge Guide ch.4 «Cash Flow Analysis»; стандартная accrual-vs-cash quality analysis (Beneish M-score 1999, Healy & Wahlen JIFM 1999 «A Review of the Earnings Management Literature»)"
    source_uz: "IFC SME Banking Knowledge Guide 4-bob «Pul oqimi tahlili»; standart accrual-vs-cash sifat tahlili (Beneish M-score 1999, Healy & Wahlen JIFM 1999)"
    formula: "operating_cash_flow / net_profit < 0.50 AND net_profit > 0"
    rationale: "OCF существенно ниже net profit = прибыль на бумаге не подкреплена реальным cash flow. Сигнал earnings manipulation или агрессивного revenue recognition. ADR-0024 Session 2: silent при net_profit ≤ 0 — эту ситуацию ловит NEGATIVE_PROFIT_3Q"

  # --- Платёжная дисциплина ---
  - id: TAX_PAYMENT_DELAYS
    name: "Задержки уплаты налогов >30 дней"
    name_uz: "Soliq toʻlovlarida 30 kun dan ortiq kechikish"
    category: payment_discipline
    severity: medium
    source: "НК РУз; внутренние методики Soliq + банковская практика"
    source_uz: "НК РУз; Soliq ichki uslublari + bank amaliyoti"
    formula: "any(payment.delay_days > 30 for payment in tax_events)"
    rationale: "Системные задержки — слабая платёжная дисциплина"

  - id: BANK_ACCOUNT_FROZEN_12M
    name: "Приостановка счёта Soliq за последние 12 месяцев"
    name_uz: "Soʻnggi 12 oyda Soliq tomonidan hisob raqamining toʻxtatilishi"
    category: payment_discipline
    severity: high
    source: "НК РУз; внутренние практики Soliq; банковский compliance"
    source_uz: "НК РУз; Soliq ichki amaliyoti; bank compliance"
    formula: "any(ev.type == ACCOUNT_FREEZE for ev in events_last_12m)"
    rationale: "Прямое ограничение со стороны налоговой"

  - id: TAX_PENALTIES_CURRENT_YEAR
    name: "Материальная пеня по налогам в текущем календарном году"
    name_uz: "Joriy kalendar yilida moddiy soliq penyasi"
    category: payment_discipline
    severity: medium
    source: "НК РУз ст.223 (сокрытие налоговой базы, штраф 20% от суммы) vs ст.219 КоАО (просрочка отчёта, БРВ-штраф); банковская методика оценки платёжной дисциплины"
    source_uz: "ЎзР СК 223-моддаси (солиқ базасини яшириш, маблағнинг 20% штрафи) vs МЖтК 219-моддаси (ҳисобот кечиктириш, БҲМ штрафи); toʻlov intizomini baholash bank uslubi"
    formula: "any(ev.type == PENALTY and ev.year == current_year AND ev.material)"
    rationale: "Материальная пеня по ст.223 НК РУз (сокрытие, штраф 20%) — реальный credit-risk сигнал. Процедурные пени по ст.219 КоАО (просрочка отчёта, БРВ-штраф) — операционная неаккуратность, отфильтровываются. ADR-0024 Session 3: добавлен фильтр `material=True`"

  # --- Контрагентные ---
  - id: SINGLE_BUYER_CONCENTRATION
    name: "Концентрация >70% выручки на одном покупателе"
    name_uz: "Tushumning 70% dan ortigʻi bitta xaridorga toʻgʻri keladi"
    category: counterparty
    severity: medium
    source: "Базель III concentration risk; внутренние методики Kapitalbank"
    source_uz: "Базель III concentration risk; Kapitalbank ichki uslublari"
    formula: "max_buyer_revenue_share > 0.70"
    rationale: "Высокий риск потери всего бизнеса при уходе клиента"

  - id: SINGLE_SUPPLIER_CONCENTRATION
    name: "Концентрация закупок у одного поставщика (foreign-escalation)"
    name_uz: "Xaridlarning bitta yetkazib beruvchida toʻplanishi (chet ellik-eskalatsiya)"
    category: counterparty
    severity: medium
    source: "Basel III concentration risk; FATF Recommendation 10 (CDD — foreign-counterparty enhanced due diligence); supply-chain risk practice"
    source_uz: "Basel III concentration risk; FATF tavsiya 10 (CDD — chet ellik kontragent uchun kuchaytirilgan tekshiruv); supply-chain tavakkalligi amaliyoti"
    formula: "(max_supplier.is_foreign AND max_share > 0.50) → high; max_share > 0.60 → medium"
    rationale: "Зависимость от единственного поставщика. ADR-0024 Session 3: dual-severity — foreign-поставщик при доле >0.50 эскалируется до HIGH (FATF R.10 enhanced CDD, supply-chain currency/sanctions exposure), domestic >0.60 остаётся MEDIUM (Basel III baseline). Severity HIGH передаётся через FiringEvidence override поверх YAML medium"

  - id: NEW_COUNTERPARTY_LARGE_SHARE
    name: "Новые контрагенты (<180 дней) дают >30% оборота"
    name_uz: "Yangi kontragentlar (<180 kun) aylanmaning 30% dan ortigʻini beradi"
    category: counterparty
    severity: high
    source: "FATF Recommendation 10 (Customer Due Diligence); Закон РУз ЗРУ-660 «О ПОД/ФТ»; EAG (Eurasian Group on combating money laundering) typology reports"
    source_uz: "FATF tavsiya 10 (CDD); ЎзР ЗРУ-660-сонли қонуни (АКМ ва ПФ); EAG типология ҳисоботлари"
    formula: "sum(share for new_counterparties) > 0.30"
    rationale: "Типичная схема накрутки оборотов перед получением кредита"

  - id: SHELL_COMPANY_PARTNERS
    name: "Юр-лица-контрагенты с ИНН моложе 6 месяцев"
    name_uz: "INN olingan vaqti 6 oydan kam boʻlgan yuridik shaxs kontragentlar"
    category: counterparty
    severity: high
    source: "FATF Recommendation 10 (CDD) + Recommendation 24 (Beneficial Ownership); Закон РУз ЗРУ-660 «О ПОД/ФТ»; EAG typology — shell-company misuse"
    source_uz: "FATF tavsiya 10 (CDD) ва 24 (Beneficial Ownership); ЎзР ЗРУ-660-сонли қонуни; EAG типология"
    formula: "any(months_since_registration(cp) < 6 AND cp.opf != IE)"
    rationale: "Классическая схема фиктивной отчётности. ADR-0024 Session 3: ИП исключены — регистрация в Узбекистане за 1-2 дня, уставного капитала не требует (Закон РУз «О гарантиях свободы предпринимательской деятельности»), молодой ИП = норма. opf=None (legacy / data source без поля) трактуется conservative: fires"

  - id: CIRCULAR_INVOICING
    name: "Циклические ЭСФ с контрагентами (объём пары ≥100 млн сум)"
    name_uz: "Kontragentlar bilan tsiklik EHF (juftlik hajmi ≥100 mln soʻm)"
    category: counterparty
    severity: high
    source: "НК РУз гл. 17 (НДС, выставление счетов-фактур); EAG typology reports — VAT carousel patterns; Закон РУз ЗРУ-660; FATF Recommendation 21 (suspicious transactions)"
    source_uz: "ЎзР СК 17-боби (QQS, ҳисобварақ-фактуралар); EAG типология ҳисоботлари — QQS «карусели»; ЎзР ЗРУ-660; FATF tavsiya 21"
    formula: "exists 2-cycle: A→B and B→A within 90 days AND pair_total_volume >= 100_000_000 UZS"
    rationale: "Симулированный документооборот для увеличения видимого оборота. ADR-0024: добавлен материальный порог пары ≥100 млн сум — ниже рутинные bidirectional ЭСФ (subcontracting, factoring, mutual offsets)"

  # --- Meta (data-quality safeguards) ---
  - id: INSUFFICIENT_DATA
    name: "Недостаточно данных для оценки"
