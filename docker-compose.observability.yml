# T3.1 — GlitchTip on-prem observability sidecar (opt-in).
#
# GlitchTip — open-source Sentry-compatible error tracking. Self-hosted
# (PROJECT_BRIEF Sec 8 запрещает SaaS Sentry — data leaves банк периметр).
#
# Подъём (dev):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Stack (4 контейнера):
#   - glitchtip-postgres: отдельная БД для GlitchTip (отдельна от credit-postgres).
#   - glitchtip-redis: cache + celery broker.
#   - glitchtip-web: Django web на :8001 host.
#   - glitchtip-worker: Celery beat + worker (background event processing).
#
# Первый старт:
#   1. Сервисы поднимутся, web применит миграции автоматически (entrypoint).
#   2. Открыть http://localhost:8001 → создать superuser:
#      docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#        exec glitchtip-web ./manage.py createsuperuser
#   3. Войти, создать organization + project, скопировать DSN.
#   4. Прокинуть в credit-api .env:
#      SENTRY_DSN=http://<key>@localhost:8001/<project_id>
#      NEXT_PUBLIC_SENTRY_DSN=<тот же>
#   5. Перезапустить api + web — события начнут приходить.
#
# Производство: GlitchTip — отдельный compose-project (либо bundled в tarball
# как опциональный module). См. docs/operations/observability.md.

services:
  glitchtip-postgres:
    image: postgres:16-alpine
    container_name: credit-glitchtip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10

  glitchtip-redis:
    image: redis:7-alpine
    container_name: credit-glitchtip-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - glitchtip_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  glitchtip-web:
    image: glitchtip/glitchtip:v4.2
    container_name: credit-glitchtip-web
    restart: unless-stopped
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-prod-32+random-bytes}
      PORT: "8000"
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@bank.uz}
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
      ENABLE_ORGANIZATION_CREATION: "true"
    ports:
      - "8001:8000"
    volumes:
      - glitchtip_uploads:/code/uploads

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.2
    container_name: credit-glitchtip-worker
    restart: unless-stopped
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-prod-32+random-bytes}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@bank.uz}
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  glitchtip_pgdata:
  glitchtip_redisdata:
  glitchtip_uploads:
