# T3.3 — Prometheus + Grafana metrics sidecar (opt-in).
#
# Подъём:
#   1. METRICS_ENABLED=true в .env (включает /metrics endpoint в credit-api).
#   2. docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
#   3. Открыть http://localhost:3001 → admin/admin → дашборд
#      "Credit Assistant — Operations" уже provision'ен.
#
# Prometheus storage: 30 дней по умолчанию через --storage.tsdb.retention.time.
# Grafana persistence: named volume.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: credit-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./deploy/metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: credit-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./deploy/metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus_data:
  grafana_data:
