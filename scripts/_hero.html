<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hero</title>
<style>
  :root {
    --bg-1: #0b1220;
    --bg-2: #0f1d3a;
    --bg-3: #1e3a8a;
    --ink-1: #f8fafc;
    --ink-2: #cbd5e1;
    --ink-3: #94a3b8;
    --accent: #38bdf8;
    --accent-soft: #0ea5e9;
    --grid: rgba(56, 189, 248, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1280px;
    height: 400px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--ink-1);
    background: #000;
  }
  .stage {
    position: relative;
    width: 1280px;
    height: 400px;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(56, 189, 248, 0.18), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(99, 102, 241, 0.22), transparent 60%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, #11214a 100%);
    overflow: hidden;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 50%, #000 40%, transparent 78%);
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
  }
  .orb.a {
    width: 320px;
    height: 320px;
    background: #38bdf8;
    top: -120px;
    right: -60px;
  }
  .orb.b {
    width: 280px;
    height: 280px;
    background: #6366f1;
    bottom: -120px;
    left: -80px;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 56px 72px 48px;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  .topline {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    letter-spacing: 2.5px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 600;
  }
  .topline .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
  }
  h1 {
    margin: 18px 0 12px;
    font-size: 76px;
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -2px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    font-size: 19px;
    color: var(--ink-2);
    max-width: 820px;
    line-height: 1.45;
    font-weight: 400;
  }
  .tagline strong {
    color: var(--ink-1);
    font-weight: 600;
  }
  .stack {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 14px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.06);
    border: 1px solid rgba(56, 189, 248, 0.22);
    font-size: 13.5px;
    color: var(--ink-1);
    font-weight: 500;
    letter-spacing: 0.2px;
  }
  .chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
  }
  .chip b {
    font-weight: 700;
    color: var(--ink-1);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="content">
    <div class="topline">
      <span class="dot"></span>
      <span>Fintech · SME credit scoring · Uzbekistan</span>
    </div>
    <div>
      <h1>credit-assistant</h1>
      <div class="tagline">
        From raw borrower data to a <strong>committee-ready dossier in 8–20 minutes</strong>.
      </div>
    </div>
    <div class="stack">
      <span class="chip"><span class="dot"></span><b>24</b>&nbsp;regulator-cited rules</span>
      <span class="chip"><span class="dot"></span><b>8</b>&nbsp;financial KPIs</span>
      <span class="chip"><span class="dot"></span>Bilingual&nbsp;RU&nbsp;+&nbsp;UZ&nbsp;PDF</span>
      <span class="chip"><span class="dot"></span>Audit-ready evidence trail</span>
    </div>
  </div>
</div>
</body>
</html>
