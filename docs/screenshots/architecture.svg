  <line x1="920.0" y1="700" x2="920.0" y2="666" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="878.0" y="672.0" width="84" height="16" rx="4" fill="#ffffff" opacity="0.95" stroke="#e2e8f0"/>
  <text x="920.0" y="684.0" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">depends on</text>
