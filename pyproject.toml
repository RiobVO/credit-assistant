[project]
name = "credit-assistant"
version = "0.1.0"
description = "Credit Assistant MSB — внутренний инструмент банков для автоматизации досье заёмщиков"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "RiobVO", email = "eleru340@gmail.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "testcontainers[postgres]>=4.8",
]

# --- Tooling configuration ---

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
# RUF001/002/003 — детектор «ambiguous unicode» рассчитан на англоязычные проекты;
# у нас комментарии и docstrings по контракту на русском, кириллица там естественна.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "interfaces", "config"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# pydantic v2 plugin даёт корректные типы для BaseModel
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# domain тесты живут рядом с кодом (`*_test.py`); integration — в `tests/`
testpaths = ["src", "tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
