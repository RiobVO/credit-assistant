[project]
name = "credit-assistant"
version = "0.1.0"
description = "Credit Assistant MSB — внутренний инструмент банков для автоматизации досье заёмщиков"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "RiobVO", email = "eleru340@gmail.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "tzdata>=2024.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.27",
    "weasyprint>=63",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "bcrypt>=4.2",
    "python-jose[cryptography]>=3.3.0",
    "pyotp>=2.9",
    "httpx>=0.27",
    "redis>=5.0",
    "cryptography>=42",
    "ldap3>=2.9",
    "sentry-sdk[fastapi]>=2.20",
    "prometheus-fastapi-instrumentator>=7",
    "networkx>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "testcontainers[postgres,redis]>=4.8",
    "types-openpyxl>=3.1.5.20260508",
    "fakeredis>=2.20",
]

# --- Tooling configuration ---

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
# RUF001/002/003 — детектор «ambiguous unicode» рассчитан на англоязычные проекты;
# у нас комментарии и docstrings по контракту на русском, кириллица там естественна.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "interfaces", "config", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# pydantic v2 plugin даёт корректные типы для BaseModel
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# WeasyPrint не публикует стабы и не помечен py.typed — у нас тонкая
# обёртка ``WeasyPrintPdfRenderer``, ловящая ImportError при отсутствии
# нативных Pango/HarfBuzz, тип ``bytes`` форсируем вручную.
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docker-py транзитивно подтягивается testcontainers'ом. На CI mypy
# находит частичные стабы (модуль резолвится), но без атрибутов вроде
# ``from_env`` — ``follow_imports = "skip"`` отключает walking содержимого
# модуля, всё что мы вызываем у docker-клиента типизируется как Any.
module = ["docker", "docker.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# jose не публикует py.typed; bcrypt типизирован, но pyright/mypy могут
# не дотягивать стабы — оборачиваем оба в тонкие сервисы с явным cast.
module = ["jose", "jose.*", "bcrypt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fakeredis (dev-dep для T1.2 denylist unit-тестов) не имеет py.typed.
# testcontainers.redis импорт-уровневые типы не полные.
module = ["fakeredis", "fakeredis.*", "testcontainers.redis", "testcontainers.redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ldap3 (T1.5 / ADR-0019) — pure Python LDAP client. py.typed отсутствует,
# обёртка LdapClient форсирует cast на наших call-site'ах.
module = ["ldap3", "ldap3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# networkx (CA-002) — Python graph library. py.typed отсутствует на момент
# 3.x; types-networkx — community-stubs из typeshed-third-party. Наша обёртка
# `_build_graph` хранит invariant (only str-INN nodes, edge dict externally),
# поэтому Any-types из networkx не текут в правило.
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# domain тесты живут рядом с кодом (`*_test.py`); integration — в `tests/`
testpaths = ["src", "tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты против real Postgres из testcontainers (требуют запущенный Docker)",
]
